services:
  app:
    build: .
    container_name: ezepost_app
    volumes:
      - .:/var/www/html
      - ezepost_storage:/var/www/html/storage
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: ezepost_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: ezepost_mysql
    environment:
      MYSQL_DATABASE: ezepost
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ezepost
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - ezepost_mysql_data:/var/lib/mysql

volumes:
  ezepost_mysql_data:
  ezepost_storage:
